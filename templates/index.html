{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-section">
    <h2 class="text-medium">Login Form</h2>
    <form action="{{ url_for('index') }}" method="POST" class="login-form">
        <input type="text" name="username" class="form-input" placeholder="Your username, or something else...">
        <input type="text" name="password" class="form-input" placeholder="Your password">
        <button type="submit" class="btn">Buscar</button>
    </form>
</div>
{% endblock %}
